<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Titan Fitness Club - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .login-card{
            width:400px;
            margin:auto;
            margin-top:120px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.15);
            background:white;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h2 class="text-center mb-4">
        Titan Fitness Club
    </h2>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label>Username</label>

            <input
                    type="text"
                    class="form-control"
                    name="username"
                    required>
        </div>

        <div class="mb-3">
            <label>Password</label>

            <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>
        </div>

        <button class="btn btn-primary w-100">
            Login
        </button>

    </form>

</div>

</body>
</html>
