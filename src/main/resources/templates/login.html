<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Fitness Club - Login</title>

    <style>
        * { box-sizing:border-box; }
        body {
            min-height:100vh; margin:0; padding:24px;
            display:grid; place-items:center;
            color:#f5f5f5; background:radial-gradient(ellipse at 50% 0%,#282315 0,#121212 52%);
            font-family:Inter, 'Segoe UI', sans-serif;
        }
        .login-card {
            width:min(100%,420px); padding:clamp(26px,6vw,42px);
            border:1px solid rgba(212,175,55,.28); border-radius:22px;
            background:linear-gradient(145deg,rgba(34,34,34,.98),rgba(22,22,22,.98));
            box-shadow:0 24px 80px rgba(0,0,0,.42);
        }
        .brand { text-align:center; margin-bottom:30px; }
        .brand-mark { color:#d4af37; font-size:13px; font-weight:800; letter-spacing:.35em; }
        h1 { margin:8px 0; color:#f4d477; font-size:clamp(25px,6vw,32px); }
        .brand p { margin:0; color:#aaa; font-size:14px; }
        .field { margin:18px 0; }
        label { display:block; margin-bottom:8px; color:#ddd; font-size:14px; font-weight:600; }
        input {
            width:100%; min-height:48px; padding:12px 14px; border:1px solid #414141;
            border-radius:10px; background:#141414; color:#fff; font:inherit;
        }
        input:focus { outline:2px solid #d4af37; outline-offset:1px; border-color:#d4af37; }
        button {
            width:100%; min-height:49px; margin-top:8px; border:0; border-radius:10px;
            background:#d4af37; color:#111; font-family:inherit; font-size:15px; font-weight:700;
            cursor:pointer; transition:filter .2s,transform .2s;
        }
        button:hover { filter:brightness(1.1); transform:translateY(-1px); }
        .notice { padding:11px 13px; border-radius:9px; font-size:14px; }
        .text-danger { color:#ffb4a9; background:rgba(180,35,24,.14); border:1px solid rgba(255,100,80,.28); }
        .text-success { color:#9be0b3; background:rgba(46,204,113,.12); border:1px solid rgba(46,204,113,.25); }
        .join { margin:22px 0 0; text-align:center; color:#aaa; font-size:14px; }
        .join a { color:#f4d477; font-weight:700; text-decoration:none; }
        .join a:hover { text-decoration:underline; }
        :focus-visible { outline:3px solid #f4d477; outline-offset:3px; }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <div class="brand-mark">TITAN FITNESS CLUB</div>
        <h1>Welcome back</h1>
        <p>Sign in to continue your fitness journey.</p>
    </div>

    <p th:if="${param.error}" class="notice text-danger" role="alert">Invalid username or password, or the account is disabled.</p>
    <p th:if="${registrationSuccess}" th:text="${registrationSuccess}" role="status" class="notice text-success"></p>

    <form th:action="@{/login}" method="post">

        <div class="field">
            <label for="username">Username</label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    required>
        </div>

        <div class="field">
            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required>
        </div>

        <button type="submit">
            Sign in
        </button>

    </form>

    <p class="join">New to Titan? <a th:href="@{/register}">Create an account</a></p>

</div>

</body>
</html>
