<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Member Form</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('members')"></div>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <div class="form-card">

        <h2 th:text="${member.id == null ? 'Add Member' : 'Edit Member'}"></h2>

        <form th:action="@{/members/save}"
              th:object="${member}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Member ID</label>
                <input type="text" th:field="*{memberId}" required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select th:field="*{gender}">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" min="1" th:field="*{age}">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea th:field="*{address}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Join Date</label>
                <input type="date" th:field="*{joinDate}">
            </div>

            <div class="form-group">
                <label>Membership Plan</label>

                <select th:field="*{membershipPlan}">
                    <option value="">No plan assigned</option>
                    <option th:each="plan : ${plans}" th:value="${plan.planName}"
                            th:text="|${plan.planName} — ₹${plan.price} (${plan.durationMonths} months)|"></option>
                </select>
                <small>For a member login, ask the member to register and create their own password.</small>

            </div>

            <div class="form-group">
                <label>Status</label>

                <select th:field="*{status}">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

            </div>

            <div class="form-actions">

                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Member
                </button>

                <a th:href="@{/members}" class="btn btn-danger">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
