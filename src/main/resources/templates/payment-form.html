<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Payment</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('payments')"></div>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <div class="form-card">

        <h2 th:text="${payment.id == null ? 'Add Payment' : 'Edit Payment'}"></h2>

        <form th:action="@{/payments/save}"
              th:object="${payment}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">

                <label>Member</label>

                <select th:field="*{member}" required>

                    <option value="">Select Member</option>

                    <option th:each="member : ${members}"
                            th:value="${member.id}"
                            th:text="${member.fullName}">
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Membership Plan</label>

                <select th:field="*{membershipPlan}" required>

                    <option value="">Select Plan</option>

                    <option th:each="plan : ${plans}"
                            th:value="${plan.id}"
                            th:text="${plan.planName}">
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Amount (₹)</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       th:field="*{amount}"
                       required>

            </div>

            <div class="form-group">

                <label>Payment Date</label>

                <input type="date"
                       th:field="*{paymentDate}"
                       required>

            </div>

            <div class="form-group">

                <label>Payment Method</label>

                <select th:field="*{paymentMethod}">

                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                    <option value="Net Banking">Net Banking</option>

                </select>

            </div>

            <div class="form-group">

                <label>Payment Status</label>

                <select th:field="*{paymentStatus}">

                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                    <option value="Failed">Failed</option>

                </select>

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-success">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Payment

                </button>

                <a th:href="@{/payments}"
                   class="btn btn-danger">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
