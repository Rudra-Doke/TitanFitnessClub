<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Membership Plans</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('plans')"></div>
<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <h1 class="page-title">
        Membership Plans
    </h1>

    <a th:href="@{/plans/add}" class="btn btn-success">
        <i class="fa-solid fa-plus"></i>
        Add Plan
    </a>

    <div class="table-container">

        <table class="table">

            <thead>

            <tr>

                <th>ID</th>
                <th>Plan Name</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="plan : ${plans}">

                <td th:text="${plan.id}"></td>

                <td th:text="${plan.planName}"></td>

                <td th:text="${'₹ ' + plan.price}"></td>
                <td th:text="|${plan.durationMonths} Months|"></td>
                <td th:text="${plan.status}"></td>

                <td>

                    <div class="action-buttons">

                        <a class="btn btn-primary"
                           th:href="@{/plans/edit/{id}(id=${plan.id})}">
                            <i class="fa-solid fa-pen"></i>
                            Edit
                        </a>

                        <form method="post" th:action="@{/plans/delete/{id}(id=${plan.id})}" onsubmit="return confirm('Delete this plan?')" class="inline-form"><button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button></form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
