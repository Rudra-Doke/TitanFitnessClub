<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Mark Attendance</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('attendance')"></div>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <div class="form-card">

        <h2>Mark Attendance</h2>

        <form th:action="@{/attendance/save}"
              th:object="${attendance}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">

                <label>Member</label>

                <select th:field="*{memberId}" required>

                    <option value="">Select Member</option>

                    <option th:each="member : ${members}"
                            th:value="${member.id}"
                            th:text="${member.fullName}">
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Date</label>

                <input type="date"
                       th:field="*{attendanceDate}"
                       required>

            </div>

            <div class="form-group">

                <label>Check In</label>

                <input type="time"
                       th:field="*{checkIn}">

            </div>

            <div class="form-group">

                <label>Check Out</label>

                <input type="time"
                       th:field="*{checkOut}">

            </div>

            <div class="form-group">

                <label>Status</label>

                <select th:field="*{status}">

                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>

                </select>

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-success">

                    <i class="fa-solid fa-check"></i>

                    Save Attendance

                </button>

                <a th:href="@{/attendance}"
                   class="btn btn-danger">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
