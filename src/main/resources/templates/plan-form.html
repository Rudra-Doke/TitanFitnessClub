<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <title>Membership Plan</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('plans')"></div>
<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <div class="form-card">

        <h2 th:text="${plan.id == null ? 'Add Membership Plan' : 'Edit Membership Plan'}"></h2>

        <form th:action="@{/plans/save}"
              th:object="${plan}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Plan Name</label>
                <input type="text"
                       th:field="*{planName}"
                       required>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number"
                       step="0.01"
                       min="0"
                       th:field="*{price}"
                       required>
            </div>

            <div class="form-group">
                <label>Duration (Months)</label>
                <input type="number"
                       min="1"
                       th:field="*{durationMonths}"
                       required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}"
                          rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>

                <select th:field="*{status}">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

            </div>

            <div class="form-actions">

                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Plan
                </button>

                <a th:href="@{/plans}" class="btn btn-danger">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
