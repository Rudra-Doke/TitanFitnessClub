<div class="topbar" th:fragment="header">

    <div class="search-box" aria-label="Member portal">Member portal</div>

    <div class="top-right">

        <a th:href="@{/member/announcements}" aria-label="Gym announcements" title="Gym announcements">
            <i class="fa-solid fa-bullhorn"></i>
        </a>

        <div class="profile">

            <a class="avatar" th:href="@{/member/profile}" th:text="${currentMember != null and !#strings.isEmpty(currentMember.fullName) ? #strings.substring(currentMember.fullName, 0, 1).toUpperCase() : 'M'}" aria-label="Open profile">M</a>

            <div>
                <strong th:text="${currentMember != null ? currentMember.fullName : 'Member'}">Member</strong><br>
                Titan Fitness Club
            </div>

        </div>

    </div>

</div>
