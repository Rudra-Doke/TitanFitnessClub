<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Attendance</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('attendance')"></div>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <h1 class="page-title">
        Attendance
    </h1>

    <a th:href="@{/attendance/add}"
       class="btn btn-success">

        <i class="fa-solid fa-calendar-plus"></i>

        Mark Attendance

    </a>

    <div class="table-container">

        <table class="table">

            <thead>

            <tr>

                <th>ID</th>
                <th>Member</th>
                <th>Date</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="attendance : ${attendanceList}">

                <td th:text="${attendance.id}"></td>

                <td th:text="${attendance.member.fullName}"></td>

                <td th:text="${attendance.attendanceDate}"></td>

                <td th:text="${attendance.checkIn}"></td>

                <td th:text="${attendance.checkOut}"></td>

                <td th:text="${attendance.status}"></td>

                <td>

                    <form method="post" th:action="@{/attendance/delete/{id}(id=${attendance.id})}" onsubmit="return confirm('Delete attendance record?')" class="inline-form"><button type="submit" class="btn btn-danger">

                        <i class="fa-solid fa-trash"></i>

                        Delete

                    </button></form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
