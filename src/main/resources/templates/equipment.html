<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <title>Equipment</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/sidebar :: sidebar('equipment')"></div>

<div th:replace="fragments/header :: header"></div>

<div class="main-content">

    <h1 class="page-title">

        Equipment Management

    </h1>

    <a th:href="@{/equipment/add}" class="btn btn-success">

        <i class="fa-solid fa-plus"></i>

        Add Equipment

    </a>

    <div class="table-container">

        <table class="table">

            <thead>

            <tr>

                <th>ID</th>
                <th>Equipment ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="equipment : ${equipmentList}">

                <td th:text="${equipment.id}"></td>

                <td th:text="${equipment.equipmentId}"></td>

                <td th:text="${equipment.equipmentName}"></td>

                <td th:text="${equipment.category}"></td>

                <td th:text="${equipment.brand}"></td>

                <td th:text="${equipment.quantity}"></td>

                <td th:text="${equipment.status}"></td>

                <td>

                    <div class="action-buttons">

                        <a class="btn btn-primary"
                           th:href="@{/equipment/edit/{id}(id=${equipment.id})}">

                            <i class="fa-solid fa-pen"></i>

                            Edit

                        </a>

                        <form method="post" th:action="@{/equipment/delete/{id}(id=${equipment.id})}" onsubmit="return confirm('Delete this equipment?')" class="inline-form"><button type="submit" class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                            Delete

                        </button></form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
