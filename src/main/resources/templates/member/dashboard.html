<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Member Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/member-sidebar :: sidebar"></div>

<div class="main-content">

    <div th:replace="fragments/member-header :: header"></div>

    <div class="dashboard-content">

        <h1 th:text="|Welcome, ${member.fullName}!|">Welcome</h1>

        <div class="cards">

            <div class="card">
                <i class="fa-solid fa-id-card"></i>
                <h3>Membership</h3>
                <p th:text="${planName}">Plan</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-calendar-check"></i>
                <h3>Attendance</h3>
                <p th:text="${attendanceToday}">Attendance</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-credit-card"></i>
                <h3>Payments</h3>
                <p th:text="${latestPaymentStatus}">Payment status</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-dumbbell"></i>
                <h3>Workout</h3>
                <p th:text="|${workoutCount} workout plan(s) assigned|">Workout plans</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
