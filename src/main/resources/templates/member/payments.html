<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payments</title>

    <link rel="stylesheet" th:href="@{/css/member/payments.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">

</head>

<body>

<div th:replace="~{fragments/member-sidebar :: sidebar}"></div>

<div class="main-content">

    <div th:replace="~{fragments/member-header :: header}"></div>

    <div class="dashboard-content">

        <h1>PAYMENTS</h1>

        <p class="checkout-message" role="status" aria-live="polite"></p>

        <div class="payment-history">

            <h2>Payment History</h2>

            <table>

                <thead>
                <tr>
                    <th>Date</th>
                    <th>Plan</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="payment : ${payments}">

                    <td th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy')}">
                        08 Aug 2026
                    </td>

                    <td th:text="${payment.membershipPlan.planName}">
                        Premium
                    </td>

                    <td th:text="'₹' + ${payment.amount}">
                        ₹0
                    </td>

                    <td th:text="${payment.paymentMethod}">
                        Cash
                    </td>

                    <td>
                        <span th:text="${payment.paymentStatus}"
                              th:classappend="${#strings.equalsIgnoreCase(payment.paymentStatus, 'Paid')} ? 'paid' : 'pending'">
                            Paid
                        </span>
                    </td>

                    <td>
                        <button type="button" class="membership-action pay-online-button"
                                th:if="${razorpayConfigured and #strings.equalsIgnoreCase(payment.paymentStatus, 'Pending')}"
                                th:attr="data-payment-id=${payment.id}">Pay online</button>
                        <span th:if="${!razorpayConfigured and #strings.equalsIgnoreCase(payment.paymentStatus, 'Pending')}"
                              class="payment-unavailable">Contact the gym to pay</span>
                        <span th:if="${!#strings.equalsIgnoreCase(payment.paymentStatus, 'Pending')}">—</span>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(payments)}">

                    <td colspan="6" class="no-payments">
                        No payment records found.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:src="@{/js/razorpay-checkout.js}" defer></script>

</body>

</html>
