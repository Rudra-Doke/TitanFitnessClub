<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Profile</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/member-dashboard.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div th:replace="fragments/member-sidebar :: sidebar"></div>

<div class="main-content">

    <div th:replace="fragments/member-header :: header"></div>

    <div class="dashboard-content">

        <h1>My Profile</h1>

        <div class="card" style="max-width:700px;">

            <h2 th:text="${member.fullName}">Member Name</h2>

            <hr><br>

            <p><strong>Username:</strong>
                <span th:text="${member.username}"></span>
            </p>

            <p><strong>Email:</strong>
                <span th:text="${member.email}"></span>
            </p>

            <p><strong>Phone:</strong>
                <span th:text="${member.phone}"></span>
            </p>

            <p><strong>Gender:</strong>
                <span th:text="${member.gender}"></span>
            </p>

            <p><strong>Age:</strong>
                <span th:text="${member.age}"></span>
            </p>

            <p><strong>Membership:</strong>
                <span th:text="${member.membershipPlan}"></span>
            </p>

        </div>

    </div>

</div>

</body>

</html>
