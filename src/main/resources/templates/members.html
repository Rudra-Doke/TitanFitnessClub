<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <title>Members</title>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar('members')}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">

    <h1 class="page-title">
        Members
    </h1>

    <a th:href="@{/members/add}" class="btn btn-success">
        <i class="fa-solid fa-user-plus"></i>
        Add Member
    </a>

    <form th:action="@{/members}" method="get" class="member-filter" role="search">
        <label for="memberSearch">Find a member</label>
        <input id="memberSearch" type="search" name="q" th:value="${searchQuery}" placeholder="Name, email, or member ID">
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:if="${searchQuery != ''}" th:href="@{/members}" class="btn">Clear</a>
    </form>

    <div class="table-container">

        <table class="table">

            <thead>

            <tr>

                <th>ID</th>
                <th>Member ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="member : ${members}">

                <td th:text="${member.id}"></td>

                <td th:text="${member.memberId}"></td>

                <td th:text="${member.fullName}"></td>

                <td th:text="${member.phone}"></td>

                <td th:text="${member.membershipPlan}"></td>

                <td th:text="${member.status}"></td>

                <td>

                    <div class="action-buttons">

                        <a class="btn btn-primary"
                           th:href="@{/members/edit/{id}(id=${member.id})}">
                            <i class="fa-solid fa-pen"></i>
                            Edit
                        </a>

                        <form method="post" th:action="@{/members/delete/{id}(id=${member.id})}" onsubmit="return confirm('Deactivate this member and their account?')" class="inline-form"><button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash"></i>
                            Deactivate
                        </button></form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>
        <p th:if="${#lists.isEmpty(members)}" class="empty-state">No members matched your search.</p>

    </div>

</div>

<style>
    .member-filter { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:20px 0; }
    .member-filter input { min-width:240px; padding:10px 12px; border:1px solid #777; border-radius:6px; }
</style>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
